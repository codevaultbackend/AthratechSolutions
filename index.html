
 <script>
    (function () {
    'use strict';

    /*
     * =========================================================
     * IHW AMELIA SERVICE CARD DETAILS
     * =========================================================
     *
     * Adds the custom text required by the IHW service-card design.
     *
     * Free Phone Consultation:
     * 30 min (The $10 secures the booking)
     * Credited if you book a Doctor’s Visit
     *
     * Wellness Evaluation:
     * 60 min (Discovery & root cause assessment)
     * Standard rate · Local rate may apply
     */

    const IHW_SERVICE_DETAILS = {
        'Free Phone Consultation': {
            duration: '30 min (The $10 secures the booking)',
            note: 'Credited if you book a Doctor’s Visit'
        },

        'Wellness Evaluation': {
            duration: '60 min (Discovery & root cause assessment)',
            note: 'Standard rate · Local rate may apply'
        }
    };


    /**
     * Find Amelia service cards and add IHW custom details.
     */
    function updateIHWServiceCards() {

        const container = document.querySelector(
            '#amelia-container'
        );

        if (!container) {
            return;
        }

        const cards = container.querySelectorAll(
            '.am-fs-service-step .am-fs__init-item'
        );

        if (!cards.length) {
            return;
        }

        cards.forEach(function (card) {

            /*
             * Find service name
             */
            const nameElement = card.querySelector(
                '.am-fs__init-item__name'
            );

            if (!nameElement) {
                return;
            }

            const serviceName = nameElement.textContent
                .replace(/\s+/g, ' ')
                .trim();


            /*
             * Only modify the two services
             * that require custom content.
             */
            const details = IHW_SERVICE_DETAILS[serviceName];

            if (!details) {
                return;
            }


            /*
             * Prevent duplicate elements.
             */
            if (card.querySelector('.ihw-service-details')) {
                return;
            }


            /*
             * Hide Amelia's original duration row.
             *
             * We only hide the clock/duration row.
             * Category and location remain untouched.
             */
            const infoRows = card.querySelectorAll(
                '.am-fs__init-item__info-inner'
            );

            infoRows.forEach(function (row) {

                const rowText = row.textContent
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();

                if (
                    rowText === '30min' ||
                    rowText === '30 min' ||
                    rowText === '1h' ||
                    rowText === '1 h' ||
                    rowText === '60min' ||
                    rowText === '60 min'
                ) {
                    row.classList.add(
                        'ihw-hide-native-duration'
                    );
                }
            });


            /*
             * Create the custom details container.
             */
            const detailsWrapper =
                document.createElement('div');

            detailsWrapper.className =
                'ihw-service-details';


            /*
             * Duration text
             */
            const durationElement =
                document.createElement('div');

            durationElement.className =
                'ihw-service-duration';

            durationElement.textContent =
                details.duration;


            /*
             * Note text
             */
            const noteElement =
                document.createElement('div');

            noteElement.className =
                'ihw-service-note';

            noteElement.textContent =
                details.note;


            /*
             * Build:
             *
             * .ihw-service-details
             *   ├── .ihw-service-duration
             *   └── .ihw-service-note
             */
            detailsWrapper.appendChild(
                durationElement
            );

            detailsWrapper.appendChild(
                noteElement
            );


            /*
             * Put the new content directly after
             * Amelia's existing information block.
             */
            const infoElement = card.querySelector(
                '.am-fs__init-item__info'
            );

            if (infoElement) {

                infoElement.insertAdjacentElement(
                    'afterend',
                    detailsWrapper
                );

            } else {

                /*
                 * Fallback if Amelia changes the
                 * information markup.
                 */
                const contentElement =
                    card.querySelector(
                        '.am-fs__init-item__content'
                    );

                if (contentElement) {
                    contentElement.appendChild(
                        detailsWrapper
                    );
                }
            }

        });
    }


    /**
     * Amelia renders/re-renders parts of the form dynamically.
     * Therefore we run once and observe future DOM changes.
     */
    function initIHWServiceDetails() {

        updateIHWServiceCards();


        const ameliaContainer =
            document.querySelector('#amelia-container');

        if (!ameliaContainer) {
            return;
        }


        const observer =
            new MutationObserver(function () {

                updateIHWServiceCards();

            });


        observer.observe(
            ameliaContainer,
            {
                childList: true,
                subtree: true
            }
        );
    }


    /*
     * Start after DOM is ready.
     */
    if (
        document.readyState === 'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initIHWServiceDetails
        );

    } else {

        initIHWServiceDetails();

    }

})();
     </script>



<script>
(function () {
    'use strict';

    const IHW_DETAILS = {
        'Free Phone Consultation': {
            duration: '30 min (The $10 secures the booking)',
            note: 'Credited if you book a Doctor’s Visit'
        },

        'Wellness Evaluation': {
            duration: '60 min (Discovery & root cause assessment)',
            note: 'Standard rate · Local rate may apply'
        }
    };

    function addServiceDetails() {

        const cards = document.querySelectorAll(
            '#amelia-container .am-fs__init-item'
        );

        if (!cards.length) {
            return;
        }

        cards.forEach(function (card) {

            const nameEl = card.querySelector(
                '.am-fs__init-item__name'
            );

            if (!nameEl) {
                return;
            }

            const serviceName = nameEl.textContent
                .replace(/\s+/g, ' ')
                .trim();

            const details = IHW_DETAILS[serviceName];

            if (!details) {
                return;
            }

            /*
             * Don't add twice.
             */
            if (card.querySelector('.ihw-service-details')) {
                return;
            }

            /*
             * Find Amelia's info rows.
             */
            const info = card.querySelector(
                '.am-fs__init-item__info'
            );

            if (!info) {
                return;
            }

            /*
             * Hide ONLY the native duration row.
             *
             * First row  = Individual Visits
             * Second row = Duration
             * Third row  = Location
             */
            const rows = info.querySelectorAll(
                '.am-fs__init-item__info-inner'
            );

            if (rows[1]) {
                rows[1].style.setProperty(
                    'display',
                    'none',
                    'important'
                );
            }

            /*
             * Create wrapper.
             */
            const wrapper = document.createElement('div');

            wrapper.className = 'ihw-service-details';

            /*
             * Duration.
             */
            const duration = document.createElement('div');

            duration.className =
                'ihw-service-duration';

            duration.textContent =
                details.duration;

            /*
             * Note.
             */
            const note = document.createElement('div');

            note.className =
                'ihw-service-note';

            note.textContent =
                details.note;

            /*
             * Add elements.
             */
            wrapper.appendChild(duration);
            wrapper.appendChild(note);

            /*
             * Put custom details after Amelia info.
             */
            info.insertAdjacentElement(
                'afterend',
                wrapper
            );
        });
    }


    /*
     * Amelia loads dynamically.
     *
     * Run repeatedly for a short period so we catch
     * the service cards whenever Amelia creates them.
     */
    function start() {

        addServiceDetails();

        let attempts = 0;

        const timer = setInterval(function () {

            addServiceDetails();

            attempts++;

            if (attempts >= 40) {
                clearInterval(timer);
            }

        }, 500);


        /*
         * Also watch Amelia for changes.
         */
        const container = document.querySelector(
            '#amelia-container'
        );

        if (container) {

            const observer =
                new MutationObserver(function () {
                    addServiceDetails();
                });

            observer.observe(container, {
                childList: true,
                subtree: true
            });
        }
    }


    /*
     * Start after page load.
     */
    if (document.readyState === 'loading') {

        document.addEventListener(
            'DOMContentLoaded',
            start
        );

    } else {

        start();

    }

})();
</script>
